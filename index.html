<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云岭迷踪</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Noto Serif SC', serif;
      background: #0d0f14;
      color: #d4d4d4;
    }

    .cover-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://image.pollinations.ai/prompt/dark%20misty%20village%20landscape%20at%20pre-dawn%20silhouetted%20Chinese%20rural%20school%20buildings%20in%20fog%20deep%20teal%20and%20black%20color%20palette%20cinematic%20mystery%20atmosphere%20no%20text%20no%20people%20wide%20angle%2016:9?width=1920&height=1080&seed=77&nologo=true') center/cover no-repeat;
      opacity: 0.45;
      z-index: 1;
    }
    .cover-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, rgba(13,15,20,0.3) 0%, rgba(13,15,20,0.85) 70%, rgba(13,15,20,1) 100%);
      z-index: 2;
    }

    .cover-content {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
    }

    .title-img {
      width: min(720px, 90vw);
      filter: invert(1) brightness(1.15) drop-shadow(0 0 18px rgba(255,255,255,0.15));
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1.2s ease-out 0.3s forwards;
    }

    .subtitle {
      margin-top: 1.2rem;
      font-size: 1.05rem;
      letter-spacing: 0.35em;
      color: #7a7a7a;
      opacity: 0;
      animation: fadeInUp 1s ease-out 1.1s forwards;
    }

    .start-btn {
      margin-top: 3.5rem;
      padding: 0.9rem 3.2rem;
      font-size: 1.15rem;
      font-family: 'Noto Serif SC', serif;
      letter-spacing: 0.25em;
      color: #c9b8a0;
      background: transparent;
      border: 1px solid rgba(201,184,160,0.35);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.35s ease;
      opacity: 0;
      animation: fadeInUp 1s ease-out 1.6s forwards;
    }
    .start-btn:hover {
      background: rgba(201,184,160,0.08);
      border-color: rgba(201,184,160,0.65);
      box-shadow: 0 0 20px rgba(201,184,160,0.12);
      transform: translateY(-2px);
    }

    .hint {
      position: absolute; bottom: 2rem;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.1em;
      opacity: 0;
      animation: fadeInUp 1s ease-out 2.2s forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="cover-bg"></div>
  <div class="cover-overlay"></div>

  <div class="cover-content">
    <img src="img/cover-title.jpeg" alt="云岭迷踪" class="title-img">
    <div class="subtitle">一款网页悬疑解谜游戏</div>
    <button class="start-btn" onclick="location.href='prologue.html'">开始游戏</button>
    <div class="hint">建议佩戴耳机 · 全屏体验</div>
  </div>
</body>
</html>
